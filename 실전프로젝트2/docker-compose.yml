# pgvector가 설치된 PostgreSQL을 띄웁니다.
# 처음 실행할 때 init/ 의 스크립트가 rag(검색용)·vault(매핑용) 스키마와 계정을 따로 만듭니다.
# 비밀번호와 임베딩 차원은 .env 에서 읽습니다 (.env.example 참고).
# 폴더 이름이 한글이라 Compose 가 프로젝트 이름을 "2" 로 잡으므로 고정
name: pii_rag

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pii_rag_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pii_rag}
      RAG_PASSWORD: ${RAG_PASSWORD:?set RAG_PASSWORD in .env}
      VAULT_PASSWORD: ${VAULT_PASSWORD:?set VAULT_PASSWORD in .env}
      EMBED_DIM: ${EMBED_DIM:-1536}
    ports:
      - "${DB_PORT:-5432}:5432"   # 호스트 포트는 .env 의 DB_PORT (로컬 PostgreSQL 이 5432 를 쓰면 5433 등으로)
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-pii_rag}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
