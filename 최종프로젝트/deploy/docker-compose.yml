# 운영(EC2) 실행 구성 — 서버 4개를 한 대에서
#   web(Nginx :80) → backend(Spring :8080) → ai(FastAPI :8000) → db(PostgreSQL+pgvector :5432)
# 밖에 여는 건 web 의 80·443 번뿐 (80 은 https 로 넘김). DB 는 서버 안(127.0.0.1:5434)에서만 — 노트북에서 볼 땐 SSH 터널
#   ${SAEBOM_HOME:-/srv/saebom}/certs, certbot-www          ← Let's Encrypt 인증서 (deploy/certbot.sh)
#
# 비밀값·데이터는 저장소 밖 서버 폴더에 (git 에 안 올라감)
#   ${SAEBOM_HOME:-/srv/saebom}/env/{db,ai,backend}.env   ← deploy/env.example/ 를 복사해 채움
#   ${SAEBOM_HOME:-/srv/saebom}/ai/data                   ← AI/data (금융상품 청크·벡터)
#   ${SAEBOM_HOME:-/srv/saebom}/ai/outputs                 ← AI/outputs (이름 보태기 모델 models/atonlee-ft-v6)
#
# 실행: docker compose -f deploy/docker-compose.yml up -d --build   (deploy/deploy.sh 가 함)
name: saebom

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    <<: *restart
    image: pgvector/pgvector:pg16
    env_file: ${SAEBOM_HOME:-/srv/saebom}/env/db.env
    environment:
      TZ: Asia/Seoul
      EMBED_DIM: "1024"
    volumes:
      - ../infra/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  ai:
    <<: *restart
    build: ../AI
    env_file: ${SAEBOM_HOME:-/srv/saebom}/env/ai.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      TZ: Asia/Seoul
    volumes:
      - ${SAEBOM_HOME:-/srv/saebom}/ai/data:/app/data
      - ${SAEBOM_HOME:-/srv/saebom}/ai/outputs:/app/outputs
      - hfcache:/hf-cache
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40   # 첫 실행은 모델 내려받기로 몇 분 걸림

  backend:
    <<: *restart
    build: ../Backend
    env_file: ${SAEBOM_HOME:-/srv/saebom}/env/backend.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AI_BASE_URL: http://ai:8000
      TZ: Asia/Seoul
    depends_on:
      db: { condition: service_healthy }
      ai: { condition: service_started }

  web:
    <<: *restart
    build: ../Frontend
    environment:
      # 이 도메인의 인증서가 /srv/saebom/certs 에 있으면 https, 없으면 http 만 (deploy/certbot.sh)
      SITE_DOMAIN: ${SITE_DOMAIN:-403.p-e.kr}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SAEBOM_HOME:-/srv/saebom}/certs:/etc/letsencrypt:ro
      - ${SAEBOM_HOME:-/srv/saebom}/certbot-www:/var/www/certbot:ro
    depends_on:
      - backend

volumes:
  pgdata:
  hfcache:
