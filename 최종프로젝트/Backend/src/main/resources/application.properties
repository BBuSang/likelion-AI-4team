spring.application.name=backend
server.port=${SERVER_PORT:8080}

# 비밀값은 Backend/.env 에서 읽음 (커밋 금지, .env.example 참고). 환경 변수가 있으면 그게 우선
spring.config.import=optional:file:./.env[.properties]

# DB: 최종프로젝트 Docker PostgreSQL (infra/, localhost:5434) 의 app 스키마, app_user 계정 (rag·vault 접근 불가)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:saebom}
spring.datasource.username=${DB_USER:app_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:app}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT 비밀키: 32바이트 이상 (기본값 없음 → 없으면 서버가 안 뜸)
jwt.secret=${JWT_SECRET}

# AI 서버 (FastAPI). 서비스 키는 AI/.env 의 AI_SERVICE_KEY 와 같은 값
ai.base-url=${AI_BASE_URL:http://localhost:8000}
ai.service-key=${AI_SERVICE_KEY}

# 첫 관리자 (관리자가 한 명도 없을 때만 만듦, 비밀번호 12자 이상)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:}
# 시작할 때 AI 서버에서 팀 목록 가져오기
app.teams.sync-on-start=${TEAMS_SYNC_ON_START:true}

# React 개발 서버 주소
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# 가입 이메일 인증 (worklog 41장). Gmail: 2단계 인증 켠 계정의 앱 비밀번호 16자리를 MAIL_PASSWORD 에 (커밋 금지)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
# 보내는 사람 이름 (주소는 MAIL_USERNAME). 비우면 코드 기본값. .properties 는 ISO-8859-1 로 읽혀 한글이 깨져서
# EmailVerificationService 가 UTF-8 로 다시 읽음 (worklog 41장)
app.mail.from-name=${MAIL_FROM_NAME:}
# false 면 인증 없이 가입 신청 가능 (메일 계정이 없는 팀원 로컬 개발용)
app.mail.verify-signup=${EMAIL_VERIFY_SIGNUP:true}

# 채팅 질문 원문 암호화 키 (worklog 64장). 비우면 JWT 비밀키에서 만듦. 바꾸면 예전 질문은 가명처리된 글로 보임
app.chat.query-key=${CHAT_QUERY_KEY:}
