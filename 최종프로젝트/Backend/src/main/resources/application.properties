spring.application.name=backend
server.port=${SERVER_PORT:8080}

# DB: 실전 2 Docker PostgreSQL (localhost:5433) 의 app 스키마. 계정·비밀번호는 환경 변수로만 (커밋 금지)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pii_rag}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:app}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT 비밀키: 32바이트 이상, 환경 변수 JWT_SECRET 로만 (기본값 없음 → 없으면 서버가 안 뜸)
jwt.secret=${JWT_SECRET}

# React 개발 서버 주소
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
