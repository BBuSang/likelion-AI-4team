spring.application.name=backend
server.port=${SERVER_PORT:8080}

# 비밀값은 Backend/.env 에서 읽음 (커밋 금지, .env.example 참고). 환경 변수가 있으면 그게 우선
spring.config.import=optional:file:./.env[.properties]

# DB: 최종프로젝트 Docker PostgreSQL (infra/, localhost:5434) 의 app 스키마, app_user 계정 (rag·vault 접근 불가)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:saebom}
spring.datasource.username=${DB_USER:app_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:app}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT 비밀키: 32바이트 이상 (기본값 없음 → 없으면 서버가 안 뜸)
jwt.secret=${JWT_SECRET}

# AI 서버 (FastAPI). 서비스 키는 AI/.env 의 AI_SERVICE_KEY 와 같은 값
ai.base-url=${AI_BASE_URL:http://localhost:8000}
ai.service-key=${AI_SERVICE_KEY}

# 첫 관리자 (관리자가 한 명도 없을 때만 만듦, 비밀번호 12자 이상)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:}
# 시작할 때 AI 서버에서 팀 목록 가져오기
app.teams.sync-on-start=${TEAMS_SYNC_ON_START:true}

# React 개발 서버 주소
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
