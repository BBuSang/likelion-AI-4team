spring.jpa.open-in-view=false
jwt.secret=test-only-secret-key-at-least-32-bytes-long!!
ai.base-url=http://localhost:1
ai.service-key=test-service-key
app.admin.email=admin@saebom.test
app.admin.password=admin-password-123
app.teams.sync-on-start=false
app.cors.allowed-origins=http://localhost:5173
