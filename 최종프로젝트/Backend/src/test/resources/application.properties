# 테스트 전용: H2 메모리 DB (Docker 없이 실행)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS app
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=test-only-secret-key-at-least-32-bytes-long!!
app.cors.allowed-origins=http://localhost:5173
